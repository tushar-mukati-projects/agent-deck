[package]
name = "claude-deck"
version = "0.1.0"
edition = "2021"

[lib]
name = "claude_deck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "preserve_order"] }
portable-pty = "0.9"
notify = "8"
rayon = "1"
ignore = "0.4"
dirs = "6"
which = "8"
parking_lot = "0.12"
anyhow = "1"
trash = "5"
base64 = "0.22"
similar = "2"
memchr = "2"
dunce = "1"
wait-timeout = "0.2"
tauri-plugin-notification = "2"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
tokio-postgres = "0.7"
tokio = { version = "1", features = ["net", "time"] }
futures-util = "0.3"
socket2 = { version = "0.6", features = ["all"] }
aho-corasick = "1"
percent-encoding = "2"
postgres-native-tls = "0.5"
native-tls = "0.2"
tauri-plugin-window-state = "2"
toml_edit = "0.25.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
